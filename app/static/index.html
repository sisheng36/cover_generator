<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmbyTool 配置</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 24px; margin-bottom: 24px; color: #1a1a2e; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card h2 { font-size: 18px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #555; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px;
  font-size: 14px; outline: none; transition: border 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #4a6cf7; box-shadow: 0 0 0 2px rgba(74,108,247,0.15); }
.form-group textarea { min-height: 80px; font-family: monospace; font-size: 13px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group.checkbox { display: flex; align-items: center; gap: 8px; }
.form-group.checkbox input { width: auto; }
.form-group.checkbox label { margin-bottom: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
}
.btn-primary { background: #4a6cf7; color: #fff; }
.btn-primary:hover { background: #3b5de7; }
.btn-primary:disabled { background: #a0b4f9; cursor: not-allowed; }
.btn-success { background: #10b981; color: #fff; }
.btn-success:hover { background: #059669; }
.actions { display: flex; gap: 12px; margin-top: 8px; }
.toast {
  position: fixed; top: 24px; right: 24px; padding: 12px 20px; border-radius: 8px;
  color: #fff; font-size: 14px; z-index: 1000; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.success { background: #10b981; }
.toast.error { background: #ef4444; }

.tab-bar { display: flex; gap: 0; margin-bottom: 20px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.tab-btn { flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: #666; transition: all 0.2s; }
.tab-btn.active { background: #4a6cf7; color: #fff; }
.tab-btn:hover:not(.active) { background: #f5f5f5; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.upload-area {
  border: 2px dashed #d9d9d9; border-radius: 12px; padding: 40px 20px; text-align: center;
  cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
}
.upload-area:hover { border-color: #4a6cf7; background: #fafbff; }
.upload-area.has-image { border-color: #10b981; background: #f0fdf4; }
.upload-area img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 12px; }
.preview-area { margin-top: 16px; text-align: center; }
.preview-area img { max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.hint { font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>EmbyTool</h1>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('config')">服务配置</button>
    <button class="tab-btn" onclick="switchTab('generate')">封面生成</button>
  </div>

  <div id="tab-config" class="tab-content active">
    <div class="card">
      <h2>Emby 服务器</h2>
      <div class="form-group">
        <label>服务器地址</label>
        <input id="emby_server_url" placeholder="例如: http://192.168.1.100:8096">
        <div class="hint">Emby/Jellyfin 服务器地址，末尾不要加斜杠</div>
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input id="emby_api_key" placeholder="Emby API Key" type="password">
      </div>
    </div>

    <div class="card">
      <h2>封面生成</h2>
      <div class="form-row">
        <div class="form-group">
          <label>封面风格</label>
          <select id="cover_style">
            <option value="single_1">单图风格 1</option>
            <option value="single_2">单图风格 2</option>
            <option value="multi_1">多图风格</option>
          </select>
        </div>
        <div class="form-group">
          <label>排序方式</label>
          <select id="sort_by">
            <option value="Random">随机</option>
            <option value="Latest">最新添加</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>模糊强度</label>
          <input id="blur_size" type="number" min="0" max="200">
        </div>
        <div class="form-group">
          <label>颜色混合比</label>
          <input id="color_ratio" type="number" min="0" max="1" step="0.1">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>中文字体大小比</label>
          <input id="zh_font_size" type="number" min="0.1" max="3" step="0.1">
        </div>
        <div class="form-group">
          <label>英文字体大小比</label>
          <input id="en_font_size" type="number" min="0.1" max="3" step="0.1">
        </div>
      </div>
      <div class="form-group checkbox">
        <input id="show_item_count" type="checkbox">
        <label for="show_item_count">显示媒体数量徽章</label>
      </div>
      <div class="form-group">
        <label>徽章风格</label>
        <select id="badge_style">
          <option value="badge">徽章</option>
          <option value="ribbon">缎带</option>
        </select>
      </div>
      <div class="form-group">
        <label>分级上限</label>
        <input id="max_safe_rating" type="number" min="0" max="999" placeholder="8 (PG-13)">
        <div class="hint">0=禁用, 8=PG-13, 999=无限制</div>
      </div>
      <div class="form-group">
        <label>标题映射 (YAML)</label>
        <textarea id="title_config" placeholder="电影库:&#10;  - 电影库&#10;  - Movies"></textarea>
      </div>
      <div class="form-group">
        <label>封面输出目录</label>
        <input id="covers_output" placeholder="留空使用默认">
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
      </div>
    </div>
  </div>

  <div id="tab-generate" class="tab-content">
    <div class="card">
      <h2>上传图片生成封面</h2>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <p style="color: #999; font-size: 14px;">点击上传或拖拽图片到这里</p>
        <img id="preview" style="display:none">
      </div>
      <input id="fileInput" type="file" accept="image/*" style="display:none" onchange="handleFile(this)">
      <div class="form-row">
        <div class="form-group">
          <label>中文标题</label>
          <input id="gen_title_zh" placeholder="例如: 黑客帝国">
        </div>
        <div class="form-group">
          <label>英文标题</label>
          <input id="gen_title_en" placeholder="例如: The Matrix">
        </div>
      </div>
      <div class="form-group">
        <label>封面风格</label>
        <select id="gen_cover_style">
          <option value="single_1">单图风格 1</option>
          <option value="single_2">单图风格 2</option>
          <option value="multi_1">多图风格</option>
        </select>
      </div>
      <div class="actions">
        <button class="btn btn-success" onclick="generateCover()">生成封面</button>
      </div>
      <div class="preview-area" id="resultArea" style="display:none">
        <h3 style="margin-bottom: 12px; font-size: 16px;">生成结果</h3>
        <img id="resultImage">
        <div style="margin-top: 12px;">
          <button class="btn btn-primary" id="downloadBtn" onclick="downloadResult()">下载封面</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedFile = null;
let currentResultBase64 = null;

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${name}'"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    const map = {
      emby_server_url: 'emby_server_url', emby_api_key: 'emby_api_key',
      cover_style: 'cover_style', sort_by: 'sort_by',
      blur_size: 'blur_size', color_ratio: 'color_ratio',
      zh_font_size: 'zh_font_size', en_font_size: 'en_font_size',
      show_item_count: 'show_item_count', badge_style: 'badge_style',
      max_safe_rating: 'max_safe_rating', title_config: 'title_config',
      covers_output: 'covers_output',
    };
    for (const [id, key] of Object.entries(map)) {
      const el = document.getElementById(id);
      if (!el) continue;
      if (el.type === 'checkbox') el.checked = !!cfg[key];
      else el.value = cfg[key] ?? '';
    }
  } catch (e) {
    showToast('加载配置失败: ' + e.message, 'error');
  }
}

async function saveConfig() {
  const fields = [
    'emby_server_url', 'emby_api_key', 'cover_style', 'sort_by',
    'blur_size', 'color_ratio', 'zh_font_size', 'en_font_size',
    'show_item_count', 'badge_style', 'max_safe_rating', 'title_config',
    'covers_output',
  ];
  const cfg = {};
  for (const id of fields) {
    const el = document.getElementById(id);
    if (!el) continue;
    cfg[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  const numFields = ['blur_size', 'color_ratio', 'zh_font_size', 'en_font_size', 'max_safe_rating'];
  for (const k of numFields) {
    if (cfg[k] !== '') cfg[k] = Number(cfg[k]);
  }
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(cfg) });
    const res = await r.json();
    if (res.ok) showToast('配置已保存', 'success');
    else showToast('保存失败: ' + res.message, 'error');
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

function handleFile(input) {
  selectedFile = input.files[0];
  if (!selectedFile) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview');
    img.src = e.target.result; img.style.display = 'block';
    document.getElementById('uploadArea').classList.add('has-image');
    document.querySelector('#uploadArea p').textContent = selectedFile.name;
  };
  reader.readAsDataURL(selectedFile);
}

async function generateCover() {
  if (!selectedFile) { showToast('请先上传图片', 'error'); return; }
  const btn = document.querySelector('#tab-generate .btn-success');
  btn.disabled = true; btn.textContent = '生成中...';

  const fd = new FormData();
  fd.append('image', selectedFile);
  fd.append('title_zh', document.getElementById('gen_title_zh').value);
  fd.append('title_en', document.getElementById('gen_title_en').value);
  fd.append('cover_style', document.getElementById('gen_cover_style').value);
  fd.append('blur_size', document.getElementById('blur_size').value || 50);
  fd.append('color_ratio', document.getElementById('color_ratio').value || 0.8);
  fd.append('zh_font_size', document.getElementById('zh_font_size').value || 1.0);
  fd.append('en_font_size', document.getElementById('en_font_size').value || 1.0);
  fd.append('show_item_count', document.getElementById('show_item_count').checked);
  fd.append('badge_style', document.getElementById('badge_style').value);

  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const res = await r.json();
    if (res.ok) {
      currentResultBase64 = res.image_base64;
      document.getElementById('resultImage').src = res.image_base64;
      document.getElementById('resultArea').style.display = 'block';
      showToast('封面生成成功', 'success');
    } else {
      showToast('生成失败: ' + res.message, 'error');
    }
  } catch (e) {
    showToast('生成失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '生成封面';
  }
}

function downloadResult() {
  if (!currentResultBase64) return;
  const a = document.createElement('a');
  a.href = currentResultBase64; a.download = 'cover.png'; a.click();
}

loadConfig();
</script>
</body>
</html>
